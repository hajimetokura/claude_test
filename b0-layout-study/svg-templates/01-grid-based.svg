<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1030mm" height="1456mm"
     viewBox="0 0 1030 1456"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd">

  <title>B0 Layout Pattern 01: Grid Based</title>

  <defs>
    <style>
      .frame { fill: none; stroke: #000; stroke-width: 0.5; }
      .area-fill { opacity: 0.08; }
      .area-stroke { fill: none; stroke-width: 0.75; stroke-dasharray: 4,2; }
      .label { font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif; fill: #666; }
      .label-large { font-size: 14px; font-weight: bold; }
      .label-small { font-size: 9px; }
      .label-dim { font-size: 7px; fill: #999; }
      .guide { fill: none; stroke: #00AEEF; stroke-width: 0.25; stroke-dasharray: 2,4; }
      .margin-line { fill: none; stroke: #FF00FF; stroke-width: 0.25; stroke-dasharray: 1,3; }
      .grid-col { fill: none; stroke: #FF00FF; stroke-width: 0.15; stroke-dasharray: 1,2; opacity: 0.4; }
    </style>
  </defs>

  <!-- ===== Layer: Background ===== -->
  <g id="background" inkscape:groupmode="layer" inkscape:label="Background">
    <rect x="0" y="0" width="1030" height="1456" fill="#FFFFFF" />
    <rect x="0" y="0" width="1030" height="1456" class="frame" />
  </g>

  <!-- ===== Layer: Margins & Guides ===== -->
  <g id="margins" inkscape:groupmode="layer" inkscape:label="Margins_Guides">
    <!-- Margins 40mm -->
    <rect x="40" y="40" width="950" height="1376" class="margin-line" />
    <!-- Center guides -->
    <line x1="515" y1="0" x2="515" y2="1456" class="guide" />
    <line x1="0" y1="728" x2="1030" y2="728" class="guide" />
    <!-- 2-Column grid: 40 | 455 | 40(gutter) | 455 | 40 -->
    <line x1="495" y1="40" x2="495" y2="1416" class="grid-col" />
    <line x1="535" y1="40" x2="535" y2="1416" class="grid-col" />
  </g>

  <!-- ===== Layer: Header ===== -->
  <g id="header" inkscape:groupmode="layer" inkscape:label="01_Header">
    <rect x="40" y="40" width="950" height="200" fill="#2C3E50" class="area-fill" />
    <rect x="40" y="40" width="950" height="200" stroke="#2C3E50" class="area-stroke" />
    <!-- Title placeholder -->
    <text x="515" y="120" text-anchor="middle" class="label label-large" style="font-size:28px; fill:#2C3E50;">タイトル</text>
    <text x="515" y="165" text-anchor="middle" class="label" style="font-size:14px;">サブタイトル / プロジェクト名</text>
    <!-- Dimension -->
    <text x="995" y="145" text-anchor="end" class="label-dim">H: 200mm</text>
  </g>

  <!-- ===== Layer: Main Visual ===== -->
  <g id="main-visual" inkscape:groupmode="layer" inkscape:label="02_MainVisual">
    <rect x="40" y="260" width="455" height="500" fill="#3498DB" class="area-fill" />
    <rect x="40" y="260" width="455" height="500" stroke="#3498DB" class="area-stroke" />
    <text x="267" y="510" text-anchor="middle" class="label label-large" style="fill:#3498DB;">メインビジュアル</text>
    <text x="267" y="535" text-anchor="middle" class="label label-small" style="fill:#3498DB;">455 × 500mm</text>
    <!-- Cross lines to indicate image area -->
    <line x1="40" y1="260" x2="495" y2="760" stroke="#3498DB" stroke-width="0.3" opacity="0.3" />
    <line x1="495" y1="260" x2="40" y2="760" stroke="#3498DB" stroke-width="0.3" opacity="0.3" />
  </g>

  <!-- ===== Layer: Text Block ===== -->
  <g id="text-block" inkscape:groupmode="layer" inkscape:label="03_TextBlock">
    <rect x="535" y="260" width="455" height="500" fill="#27AE60" class="area-fill" />
    <rect x="535" y="260" width="455" height="500" stroke="#27AE60" class="area-stroke" />
    <text x="762" y="480" text-anchor="middle" class="label label-large" style="fill:#27AE60;">テキストブロック</text>
    <text x="762" y="505" text-anchor="middle" class="label label-small" style="fill:#27AE60;">455 × 500mm</text>
    <!-- Text lines placeholder -->
    <line x1="560" y1="300" x2="780" y2="300" stroke="#27AE60" stroke-width="0.5" opacity="0.3" />
    <line x1="560" y1="320" x2="800" y2="320" stroke="#27AE60" stroke-width="0.5" opacity="0.3" />
    <line x1="560" y1="340" x2="770" y2="340" stroke="#27AE60" stroke-width="0.5" opacity="0.3" />
    <line x1="560" y1="360" x2="790" y2="360" stroke="#27AE60" stroke-width="0.5" opacity="0.3" />
    <line x1="560" y1="380" x2="760" y2="380" stroke="#27AE60" stroke-width="0.5" opacity="0.3" />
  </g>

  <!-- ===== Layer: Sub Images ===== -->
  <g id="sub-images" inkscape:groupmode="layer" inkscape:label="04_SubImages">
    <!-- Sub Image 1 -->
    <rect x="40" y="780" width="455" height="400" fill="#E67E22" class="area-fill" />
    <rect x="40" y="780" width="455" height="400" stroke="#E67E22" class="area-stroke" />
    <text x="267" y="980" text-anchor="middle" class="label label-large" style="fill:#E67E22;">サブ画像 1</text>
    <text x="267" y="1005" text-anchor="middle" class="label label-small" style="fill:#E67E22;">455 × 400mm</text>
    <line x1="40" y1="780" x2="495" y2="1180" stroke="#E67E22" stroke-width="0.3" opacity="0.3" />
    <line x1="495" y1="780" x2="40" y2="1180" stroke="#E67E22" stroke-width="0.3" opacity="0.3" />
    <!-- Sub Image 2 -->
    <rect x="535" y="780" width="455" height="400" fill="#E67E22" class="area-fill" />
    <rect x="535" y="780" width="455" height="400" stroke="#E67E22" class="area-stroke" />
    <text x="762" y="980" text-anchor="middle" class="label label-large" style="fill:#E67E22;">サブ画像 2</text>
    <text x="762" y="1005" text-anchor="middle" class="label label-small" style="fill:#E67E22;">455 × 400mm</text>
    <line x1="535" y1="780" x2="990" y2="1180" stroke="#E67E22" stroke-width="0.3" opacity="0.3" />
    <line x1="990" y1="780" x2="535" y2="1180" stroke="#E67E22" stroke-width="0.3" opacity="0.3" />
  </g>

  <!-- ===== Layer: Data Section ===== -->
  <g id="data-section" inkscape:groupmode="layer" inkscape:label="05_DataSection">
    <rect x="40" y="1200" width="950" height="116" fill="#9B59B6" class="area-fill" />
    <rect x="40" y="1200" width="950" height="116" stroke="#9B59B6" class="area-stroke" />
    <text x="515" y="1260" text-anchor="middle" class="label label-large" style="fill:#9B59B6;">データ / 図表 / スペック</text>
    <text x="515" y="1285" text-anchor="middle" class="label label-small" style="fill:#9B59B6;">950 × 116mm</text>
  </g>

  <!-- ===== Layer: Footer ===== -->
  <g id="footer" inkscape:groupmode="layer" inkscape:label="06_Footer">
    <rect x="40" y="1316" width="950" height="100" fill="#7F8C8D" class="area-fill" />
    <rect x="40" y="1316" width="950" height="100" stroke="#7F8C8D" class="area-stroke" />
    <text x="80" y="1375" class="label" style="font-size:11px; fill:#7F8C8D;">Credit / URL</text>
    <text x="950" y="1375" text-anchor="end" class="label" style="font-size:11px; fill:#7F8C8D;">VUILD</text>
    <!-- QR placeholder -->
    <rect x="880" y="1330" width="60" height="60" fill="none" stroke="#7F8C8D" stroke-width="0.5" stroke-dasharray="2,2" />
    <text x="910" y="1365" text-anchor="middle" class="label-dim">QR</text>
  </g>

  <!-- ===== Layer: Annotations ===== -->
  <g id="annotations" inkscape:groupmode="layer" inkscape:label="Annotations">
    <!-- Right side dimension labels -->
    <text x="1020" y="145" text-anchor="end" class="label-dim" transform="rotate(-90,1020,145)">Header 200mm</text>
    <text x="1020" y="510" text-anchor="end" class="label-dim" transform="rotate(-90,1020,510)">Main 500mm</text>
    <text x="1020" y="980" text-anchor="end" class="label-dim" transform="rotate(-90,1020,980)">Sub 400mm</text>
    <text x="1020" y="1260" text-anchor="end" class="label-dim" transform="rotate(-90,1020,1260)">Data 116mm</text>
    <text x="1020" y="1370" text-anchor="end" class="label-dim" transform="rotate(-90,1020,1370)">Footer 100mm</text>
    <!-- Pattern name -->
    <text x="515" y="1450" text-anchor="middle" class="label-dim" style="font-size:8px;">Pattern 01: Grid Based — B0 (1030 × 1456mm)</text>
  </g>

</svg>
