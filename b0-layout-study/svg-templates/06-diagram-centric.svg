<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1030mm" height="1456mm"
     viewBox="0 0 1030 1456"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">

  <title>B0 Layout Pattern 06: Diagram Centric</title>

  <defs>
    <style>
      .frame { fill: none; stroke: #000; stroke-width: 0.5; }
      .area-fill { opacity: 0.08; }
      .area-stroke { fill: none; stroke-width: 0.75; stroke-dasharray: 4,2; }
      .label { font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif; fill: #666; }
      .label-large { font-size: 14px; font-weight: bold; }
      .label-small { font-size: 9px; }
      .label-dim { font-size: 7px; fill: #999; }
      .margin-line { fill: none; stroke: #FF00FF; stroke-width: 0.25; stroke-dasharray: 1,3; }
      .guide { fill: none; stroke: #00AEEF; stroke-width: 0.25; stroke-dasharray: 2,4; }
      .flow-arrow { fill: #2C3E50; stroke: none; }
      .flow-line { stroke: #2C3E50; stroke-width: 1.5; fill: none; }
      .flow-line-dash { stroke: #2C3E50; stroke-width: 1; fill: none; stroke-dasharray: 4,3; }
      .node-fill { opacity: 0.12; }
      .img-cross { stroke-width: 0.3; opacity: 0.2; }
    </style>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2C3E50" />
    </marker>
  </defs>

  <!-- ===== Layer: Background ===== -->
  <g id="background" inkscape:groupmode="layer" inkscape:label="Background">
    <rect x="0" y="0" width="1030" height="1456" fill="#FFFFFF" />
    <rect x="0" y="0" width="1030" height="1456" class="frame" />
  </g>

  <!-- ===== Layer: Margins ===== -->
  <g id="margins" inkscape:groupmode="layer" inkscape:label="Margins_Guides">
    <rect x="40" y="40" width="950" height="1376" class="margin-line" />
  </g>

  <!-- ===== Layer: Header ===== -->
  <g id="header" inkscape:groupmode="layer" inkscape:label="01_Header">
    <rect x="40" y="40" width="950" height="130" fill="#2C3E50" class="area-fill" />
    <rect x="40" y="40" width="950" height="130" stroke="#2C3E50" class="area-stroke" />
    <text x="515" y="100" text-anchor="middle" class="label" style="font-size:26px; fill:#2C3E50; font-weight:bold;">システムタイトル</text>
    <text x="515" y="135" text-anchor="middle" class="label" style="font-size:12px; fill:#2C3E50;">技術概要 / ワークフロー説明</text>
  </g>

  <!-- ===== Layer: Central Diagram ===== -->
  <g id="central-diagram" inkscape:groupmode="layer" inkscape:label="02_CentralDiagram">
    <!-- Diagram background area -->
    <rect x="40" y="190" width="950" height="700" fill="#ECF0F1" class="area-fill" />
    <rect x="40" y="190" width="950" height="700" stroke="#BDC3C7" class="area-stroke" />

    <!-- Flow: Input → Process → Output -->

    <!-- Node 1: Input -->
    <rect x="80" y="380" width="200" height="120" rx="10" fill="#3498DB" class="node-fill" />
    <rect x="80" y="380" width="200" height="120" rx="10" fill="none" stroke="#3498DB" stroke-width="1" />
    <text x="180" y="430" text-anchor="middle" class="label" style="font-size:13px; fill:#3498DB; font-weight:bold;">入力</text>
    <text x="180" y="455" text-anchor="middle" class="label label-small" style="fill:#3498DB;">3Dモデル</text>
    <text x="180" y="475" text-anchor="middle" class="label label-small" style="fill:#3498DB;">パラメータ</text>

    <!-- Arrow 1 -->
    <line x1="280" y1="440" x2="370" y2="440" class="flow-line" marker-end="url(#arrowhead)" />

    <!-- Node 2: Process -->
    <rect x="380" y="340" width="260" height="200" rx="10" fill="#E67E22" class="node-fill" />
    <rect x="380" y="340" width="260" height="200" rx="10" fill="none" stroke="#E67E22" stroke-width="1" />
    <text x="510" y="400" text-anchor="middle" class="label" style="font-size:15px; fill:#E67E22; font-weight:bold;">処理</text>
    <text x="510" y="430" text-anchor="middle" class="label label-small" style="fill:#E67E22;">CNC加工 /</text>
    <text x="510" y="450" text-anchor="middle" class="label label-small" style="fill:#E67E22;">ロボットアーム</text>
    <!-- Sub-process boxes -->
    <rect x="410" y="470" width="100" height="40" rx="4" fill="none" stroke="#E67E22" stroke-width="0.5" stroke-dasharray="2,2" />
    <text x="460" y="495" text-anchor="middle" class="label-dim" style="fill:#E67E22;">工程 A</text>
    <rect x="530" y="470" width="100" height="40" rx="4" fill="none" stroke="#E67E22" stroke-width="0.5" stroke-dasharray="2,2" />
    <text x="580" y="495" text-anchor="middle" class="label-dim" style="fill:#E67E22;">工程 B</text>

    <!-- Arrow 2 -->
    <line x1="640" y1="440" x2="730" y2="440" class="flow-line" marker-end="url(#arrowhead)" />

    <!-- Node 3: Output -->
    <rect x="740" y="380" width="200" height="120" rx="10" fill="#27AE60" class="node-fill" />
    <rect x="740" y="380" width="200" height="120" rx="10" fill="none" stroke="#27AE60" stroke-width="1" />
    <text x="840" y="430" text-anchor="middle" class="label" style="font-size:13px; fill:#27AE60; font-weight:bold;">出力</text>
    <text x="840" y="455" text-anchor="middle" class="label label-small" style="fill:#27AE60;">加工部材</text>
    <text x="840" y="475" text-anchor="middle" class="label label-small" style="fill:#27AE60;">組立完成品</text>

    <!-- Feedback loop (dashed) -->
    <path d="M 840,500 L 840,600 L 180,600 L 180,500" class="flow-line-dash" marker-end="url(#arrowhead)" />
    <text x="515" y="625" text-anchor="middle" class="label-dim" style="fill:#2C3E50;">フィードバックループ</text>

    <!-- Secondary elements -->
    <rect x="80" y="230" width="150" height="80" rx="6" fill="#9B59B6" class="node-fill" />
    <rect x="80" y="230" width="150" height="80" rx="6" fill="none" stroke="#9B59B6" stroke-width="0.5" />
    <text x="155" y="275" text-anchor="middle" class="label label-small" style="fill:#9B59B6;">Grasshopper定義</text>
    <line x1="155" y1="310" x2="155" y2="370" class="flow-line-dash" marker-end="url(#arrowhead)" />

    <!-- Diagram area label -->
    <text x="515" y="850" text-anchor="middle" class="label label-small" style="fill:#BDC3C7;">ダイアグラムエリア 950 × 700mm</text>
  </g>

  <!-- ===== Layer: Detail Panels ===== -->
  <g id="detail-panels" inkscape:groupmode="layer" inkscape:label="03_DetailPanels">
    <!-- Panel 1: Legend -->
    <rect x="40" y="910" width="290" height="250" fill="#34495E" class="area-fill" />
    <rect x="40" y="910" width="290" height="250" stroke="#34495E" class="area-stroke" />
    <text x="185" y="945" text-anchor="middle" class="label" style="font-size:13px; fill:#34495E; font-weight:bold;">凡例 / Legend</text>
    <!-- Legend items -->
    <rect x="70" y="970" width="20" height="12" fill="#3498DB" opacity="0.3" stroke="#3498DB" stroke-width="0.5" />
    <text x="100" y="981" class="label label-small" style="fill:#34495E;">入力データ</text>
    <rect x="70" y="995" width="20" height="12" fill="#E67E22" opacity="0.3" stroke="#E67E22" stroke-width="0.5" />
    <text x="100" y="1006" class="label label-small" style="fill:#34495E;">加工プロセス</text>
    <rect x="70" y="1020" width="20" height="12" fill="#27AE60" opacity="0.3" stroke="#27AE60" stroke-width="0.5" />
    <text x="100" y="1031" class="label label-small" style="fill:#34495E;">出力・成果物</text>
    <line x1="70" y1="1052" x2="90" y2="1052" class="flow-line-dash" />
    <text x="100" y="1056" class="label label-small" style="fill:#34495E;">フィードバック</text>

    <!-- Panel 2: Specs -->
    <rect x="370" y="910" width="290" height="250" fill="#2C3E50" class="area-fill" />
    <rect x="370" y="910" width="290" height="250" stroke="#2C3E50" class="area-stroke" />
    <text x="515" y="945" text-anchor="middle" class="label" style="font-size:13px; fill:#2C3E50; font-weight:bold;">技術仕様</text>
    <text x="400" y="975" class="label label-small" style="fill:#2C3E50;">加工精度: ±0.1mm</text>
    <text x="400" y="1000" class="label label-small" style="fill:#2C3E50;">対応材料: 木材 / 金属 / 樹脂</text>
    <text x="400" y="1025" class="label label-small" style="fill:#2C3E50;">最大サイズ: 2440 × 1220mm</text>
    <text x="400" y="1050" class="label label-small" style="fill:#2C3E50;">加工時間: 条件による</text>

    <!-- Panel 3: Photo -->
    <rect x="700" y="910" width="290" height="250" fill="#16A085" class="area-fill" />
    <rect x="700" y="910" width="290" height="250" stroke="#16A085" class="area-stroke" />
    <line x1="700" y1="910" x2="990" y2="1160" stroke="#16A085" class="img-cross" />
    <line x1="990" y1="910" x2="700" y2="1160" stroke="#16A085" class="img-cross" />
    <text x="845" y="1035" text-anchor="middle" class="label label-large" style="fill:#16A085;">実物写真</text>
    <text x="845" y="1060" text-anchor="middle" class="label label-small" style="fill:#16A085;">290 × 250mm</text>
  </g>

  <!-- ===== Layer: Supplementary Text ===== -->
  <g id="supplementary" inkscape:groupmode="layer" inkscape:label="04_SupplementaryText">
    <rect x="40" y="1180" width="950" height="140" fill="#7F8C8D" opacity="0.04" />
    <rect x="40" y="1180" width="950" height="140" stroke="#7F8C8D" class="area-stroke" />
    <text x="80" y="1215" class="label" style="font-size:14px; fill:#7F8C8D; font-weight:bold;">補足説明</text>
    <line x1="80" y1="1240" x2="900" y2="1240" stroke="#7F8C8D" stroke-width="0.3" opacity="0.3" />
    <line x1="80" y1="1260" x2="920" y2="1260" stroke="#7F8C8D" stroke-width="0.3" opacity="0.3" />
    <line x1="80" y1="1280" x2="880" y2="1280" stroke="#7F8C8D" stroke-width="0.3" opacity="0.3" />
    <text x="515" y="1310" text-anchor="middle" class="label label-small" style="fill:#7F8C8D;">テキストエリア 950 × 140mm</text>
  </g>

  <!-- ===== Layer: Footer ===== -->
  <g id="footer" inkscape:groupmode="layer" inkscape:label="05_Footer">
    <rect x="40" y="1340" width="950" height="76" fill="#7F8C8D" class="area-fill" />
    <rect x="40" y="1340" width="950" height="76" stroke="#7F8C8D" class="area-stroke" />
    <text x="80" y="1385" class="label" style="font-size:10px; fill:#7F8C8D;">Credit / Technical Documentation</text>
    <text x="950" y="1385" text-anchor="end" class="label" style="font-size:10px; fill:#7F8C8D;">VUILD Corporation</text>
    <!-- QR -->
    <rect x="910" y="1350" width="40" height="40" fill="none" stroke="#7F8C8D" stroke-width="0.4" stroke-dasharray="2,2" />
    <text x="930" y="1374" text-anchor="middle" class="label-dim">QR</text>
  </g>

  <!-- ===== Layer: Annotations ===== -->
  <g id="annotations" inkscape:groupmode="layer" inkscape:label="Annotations">
    <text x="515" y="1450" text-anchor="middle" class="label-dim" style="font-size:8px;">Pattern 06: Diagram Centric — B0 (1030 × 1456mm)</text>
  </g>

</svg>
