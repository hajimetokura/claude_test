<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1030mm" height="1456mm"
     viewBox="0 0 1030 1456"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">

  <title>B0 Layout Pattern 04: Magazine Style</title>

  <defs>
    <style>
      .frame { fill: none; stroke: #000; stroke-width: 0.5; }
      .area-fill { opacity: 0.08; }
      .area-stroke { fill: none; stroke-width: 0.75; stroke-dasharray: 4,2; }
      .label { font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif; fill: #666; }
      .label-large { font-size: 14px; font-weight: bold; }
      .label-small { font-size: 9px; }
      .label-dim { font-size: 7px; fill: #999; }
      .margin-line { fill: none; stroke: #FF00FF; stroke-width: 0.25; stroke-dasharray: 1,3; }
      .img-cross { stroke-width: 0.3; opacity: 0.25; }
      .text-line { stroke-width: 0.5; opacity: 0.3; }
    </style>
  </defs>

  <!-- ===== Layer: Background ===== -->
  <g id="background" inkscape:groupmode="layer" inkscape:label="Background">
    <rect x="0" y="0" width="1030" height="1456" fill="#FFFFFF" />
    <rect x="0" y="0" width="1030" height="1456" class="frame" />
  </g>

  <!-- ===== Layer: Margins ===== -->
  <g id="margins" inkscape:groupmode="layer" inkscape:label="Margins_Guides">
    <rect x="40" y="40" width="950" height="1376" class="margin-line" />
  </g>

  <!-- ===== Layer: Headline ===== -->
  <g id="headline" inkscape:groupmode="layer" inkscape:label="01_Headline">
    <rect x="40" y="40" width="950" height="120" fill="#2C3E50" class="area-fill" />
    <rect x="40" y="40" width="950" height="120" stroke="#2C3E50" class="area-stroke" />
    <text x="80" y="90" class="label" style="font-size:32px; fill:#2C3E50; font-weight:bold;">大見出し</text>
    <text x="80" y="130" class="label" style="font-size:12px; fill:#2C3E50;">リード文 — プロジェクトの概要を2〜3行で記述するエリア</text>
  </g>

  <!-- ===== Layer: Main Visual (wide) ===== -->
  <g id="main-visual" inkscape:groupmode="layer" inkscape:label="02_MainVisual">
    <rect x="40" y="180" width="950" height="320" fill="#1ABC9C" class="area-fill" />
    <rect x="40" y="180" width="950" height="320" stroke="#1ABC9C" class="area-stroke" />
    <line x1="40" y1="180" x2="990" y2="500" stroke="#1ABC9C" class="img-cross" />
    <line x1="990" y1="180" x2="40" y2="500" stroke="#1ABC9C" class="img-cross" />
    <text x="515" y="345" text-anchor="middle" class="label label-large" style="fill:#1ABC9C;">メインビジュアル（横長）</text>
    <text x="515" y="370" text-anchor="middle" class="label label-small" style="fill:#1ABC9C;">950 × 320mm</text>
  </g>

  <!-- ===== Layer: Row 1 (Text left + Image right) ===== -->
  <g id="row-1" inkscape:groupmode="layer" inkscape:label="03_Row1">
    <!-- Text Column -->
    <rect x="40" y="520" width="455" height="330" fill="#27AE60" opacity="0.04" />
    <rect x="40" y="520" width="455" height="330" stroke="#27AE60" class="area-stroke" />
    <text x="80" y="555" class="label" style="font-size:16px; fill:#27AE60; font-weight:bold;">中見出し A</text>
    <!-- Text line placeholders -->
    <line x1="80" y1="580" x2="420" y2="580" stroke="#27AE60" class="text-line" />
    <line x1="80" y1="600" x2="440" y2="600" stroke="#27AE60" class="text-line" />
    <line x1="80" y1="620" x2="400" y2="620" stroke="#27AE60" class="text-line" />
    <line x1="80" y1="640" x2="430" y2="640" stroke="#27AE60" class="text-line" />
    <line x1="80" y1="660" x2="410" y2="660" stroke="#27AE60" class="text-line" />
    <line x1="80" y1="680" x2="440" y2="680" stroke="#27AE60" class="text-line" />
    <line x1="80" y1="700" x2="390" y2="700" stroke="#27AE60" class="text-line" />
    <line x1="80" y1="720" x2="430" y2="720" stroke="#27AE60" class="text-line" />
    <text x="267" y="790" text-anchor="middle" class="label label-small" style="fill:#27AE60;">本文 Col 1 — 455 × 330mm</text>

    <!-- Image Column -->
    <rect x="535" y="520" width="455" height="330" fill="#E67E22" class="area-fill" />
    <rect x="535" y="520" width="455" height="330" stroke="#E67E22" class="area-stroke" />
    <line x1="535" y1="520" x2="990" y2="850" stroke="#E67E22" class="img-cross" />
    <line x1="990" y1="520" x2="535" y2="850" stroke="#E67E22" class="img-cross" />
    <text x="762" y="690" text-anchor="middle" class="label label-large" style="fill:#E67E22;">サブビジュアル A</text>
    <text x="762" y="715" text-anchor="middle" class="label label-small" style="fill:#E67E22;">455 × 330mm</text>
  </g>

  <!-- ===== Layer: Row 2 (Image left + Text right) ===== -->
  <g id="row-2" inkscape:groupmode="layer" inkscape:label="04_Row2">
    <!-- Image Column -->
    <rect x="40" y="870" width="455" height="330" fill="#9B59B6" class="area-fill" />
    <rect x="40" y="870" width="455" height="330" stroke="#9B59B6" class="area-stroke" />
    <line x1="40" y1="870" x2="495" y2="1200" stroke="#9B59B6" class="img-cross" />
    <line x1="495" y1="870" x2="40" y2="1200" stroke="#9B59B6" class="img-cross" />
    <text x="267" y="1040" text-anchor="middle" class="label label-large" style="fill:#9B59B6;">サブビジュアル B</text>
    <text x="267" y="1065" text-anchor="middle" class="label label-small" style="fill:#9B59B6;">455 × 330mm</text>

    <!-- Text Column -->
    <rect x="535" y="870" width="455" height="330" fill="#2980B9" opacity="0.04" />
    <rect x="535" y="870" width="455" height="330" stroke="#2980B9" class="area-stroke" />
    <text x="575" y="905" class="label" style="font-size:16px; fill:#2980B9; font-weight:bold;">中見出し B</text>
    <line x1="575" y1="930" x2="915" y2="930" stroke="#2980B9" class="text-line" />
    <line x1="575" y1="950" x2="935" y2="950" stroke="#2980B9" class="text-line" />
    <line x1="575" y1="970" x2="900" y2="970" stroke="#2980B9" class="text-line" />
    <line x1="575" y1="990" x2="925" y2="990" stroke="#2980B9" class="text-line" />
    <line x1="575" y1="1010" x2="910" y2="1010" stroke="#2980B9" class="text-line" />
    <line x1="575" y1="1030" x2="930" y2="1030" stroke="#2980B9" class="text-line" />
    <line x1="575" y1="1050" x2="895" y2="1050" stroke="#2980B9" class="text-line" />
    <text x="762" y="1140" text-anchor="middle" class="label label-small" style="fill:#2980B9;">本文 Col 2 — 455 × 330mm</text>
  </g>

  <!-- ===== Layer: Footer ===== -->
  <g id="footer" inkscape:groupmode="layer" inkscape:label="05_Footer">
    <rect x="40" y="1220" width="950" height="196" fill="#7F8C8D" class="area-fill" />
    <rect x="40" y="1220" width="950" height="196" stroke="#7F8C8D" class="area-stroke" />
    <text x="80" y="1300" class="label" style="font-size:14px; fill:#7F8C8D; font-weight:bold;">まとめ / CTA</text>
    <text x="80" y="1330" class="label" style="font-size:10px; fill:#7F8C8D;">ここにまとめやコール・トゥ・アクションを配置</text>
    <text x="80" y="1395" class="label" style="font-size:9px; fill:#7F8C8D;">Credit / URL</text>
    <text x="950" y="1395" text-anchor="end" class="label" style="font-size:9px; fill:#7F8C8D;">VUILD Corporation</text>
  </g>

  <!-- ===== Layer: Annotations ===== -->
  <g id="annotations" inkscape:groupmode="layer" inkscape:label="Annotations">
    <text x="515" y="1450" text-anchor="middle" class="label-dim" style="font-size:8px;">Pattern 04: Magazine Style — B0 (1030 × 1456mm)</text>
  </g>

</svg>
