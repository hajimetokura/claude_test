<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VUILD Agent Dashboard</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-card-hover: #1a1a1a;
      --border: #2a2a2a;
      --text: #e5e5e5;
      --text-dim: #888;
      --accent: #c8956c;
      --accent-dim: #8b6344;
      --green: #4ade80;
      --yellow: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .header h1 span {
      color: var(--accent);
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
    }

    .connection-dot.connected {
      background: var(--green);
    }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      height: calc(100vh - 57px);
    }

    .main-area {
      overflow-y: auto;
      padding: 20px 24px;
    }

    .sidebar {
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Stats Row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .stat-card .label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
    }

    .stat-card .value.green { color: var(--green); }
    .stat-card .value.yellow { color: var(--yellow); }
    .stat-card .value.red { color: var(--red); }
    .stat-card .value.blue { color: var(--blue); }
    .stat-card .value.accent { color: var(--accent); }

    /* ── Section Headers ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-header h2 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
    }

    /* ── Department Grid ── */
    .dept-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .dept-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .dept-card:hover {
      border-color: var(--accent-dim);
    }

    .dept-card-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dept-card-header .dept-name {
      font-size: 14px;
      font-weight: 600;
    }

    .dept-card-header .dept-name-en {
      font-size: 11px;
      color: var(--text-dim);
    }

    .dept-card-header .agent-count {
      font-size: 11px;
      background: var(--border);
      padding: 2px 8px;
      border-radius: 10px;
      color: var(--text-dim);
    }

    .agent-list {
      padding: 8px 0;
    }

    .agent-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      transition: background 0.15s;
      cursor: pointer;
    }

    .agent-item:hover {
      background: var(--bg-card-hover);
    }

    .agent-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .agent-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      background: var(--border);
      color: var(--text);
      flex-shrink: 0;
    }

    .agent-name {
      font-size: 13px;
      font-weight: 500;
    }

    .agent-role {
      font-size: 11px;
      color: var(--text-dim);
    }

    .agent-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    .agent-status.idle { background: var(--text-dim); }
    .agent-status.running { background: var(--green); animation: pulse 1.5s infinite; }
    .agent-status.error { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Tasks Section ── */
    .tasks-section {
      margin-bottom: 32px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task-status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .task-status-badge.pending { background: #333; color: var(--text-dim); }
    .task-status-badge.running { background: #1a3a1a; color: var(--green); }
    .task-status-badge.completed { background: #1a2a3a; color: var(--blue); }
    .task-status-badge.failed { background: #3a1a1a; color: var(--red); }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      gap: 12px;
      margin-top: 2px;
    }

    .task-actions {
      display: flex;
      gap: 4px;
    }

    .task-actions button {
      background: var(--border);
      border: none;
      color: var(--text-dim);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .task-actions button:hover {
      background: #444;
      color: var(--text);
    }

    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--text-dim);
      font-size: 13px;
    }

    /* ── Sidebar: Log Feed ── */
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
    }

    .sidebar-header .clear-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
    }

    .sidebar-header .clear-btn:hover {
      color: var(--text);
    }

    .log-feed {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .log-entry {
      padding: 8px 16px;
      border-bottom: 1px solid #1a1a1a;
      font-size: 12px;
      line-height: 1.5;
    }

    .log-entry:hover {
      background: var(--bg-card-hover);
    }

    .log-time {
      color: var(--text-dim);
      font-family: monospace;
      font-size: 10px;
    }

    .log-agent {
      color: var(--accent);
      font-weight: 500;
      margin-left: 6px;
    }

    .log-message {
      margin-top: 2px;
      color: var(--text);
    }

    .log-entry.warn .log-message { color: var(--yellow); }
    .log-entry.error .log-message { color: var(--red); }
    .log-entry.success .log-message { color: var(--green); }

    /* ── New Task Form (Modal) ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 460px;
      max-width: 90vw;
    }

    .modal h3 {
      font-size: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .form-group select,
    .form-group input,
    .form-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .form-group select:focus,
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .sidebar {
        border-left: none;
        border-top: 1px solid var(--border);
        max-height: 400px;
      }
      .stats-row {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1><span>VUILD</span> Agent Dashboard</h1>
    <div class="connection-status">
      <div class="connection-dot" id="ws-dot"></div>
      <span id="ws-label">Disconnected</span>
    </div>
  </header>

  <!-- Layout -->
  <div class="layout">
    <!-- Main Area -->
    <div class="main-area">

      <!-- Stats -->
      <div class="stats-row" id="stats-row">
        <div class="stat-card">
          <div class="label">部門</div>
          <div class="value accent" id="stat-depts">-</div>
        </div>
        <div class="stat-card">
          <div class="label">エージェント</div>
          <div class="value" id="stat-agents">-</div>
        </div>
        <div class="stat-card">
          <div class="label">実行中</div>
          <div class="value green" id="stat-running">0</div>
        </div>
        <div class="stat-card">
          <div class="label">完了</div>
          <div class="value blue" id="stat-completed">0</div>
        </div>
        <div class="stat-card">
          <div class="label">失敗</div>
          <div class="value red" id="stat-failed">0</div>
        </div>
      </div>

      <!-- Tasks -->
      <div class="tasks-section">
        <div class="section-header">
          <h2>Tasks</h2>
          <button class="btn btn-primary btn-sm" onclick="openNewTaskModal()">+ 新規タスク</button>
        </div>
        <div class="task-list" id="task-list">
          <div class="empty-state">タスクはまだありません</div>
        </div>
      </div>

      <!-- Departments -->
      <div>
        <div class="section-header">
          <h2>Departments / Agents</h2>
        </div>
        <div class="dept-grid" id="dept-grid"></div>
      </div>

    </div>

    <!-- Sidebar: Live Log -->
    <aside class="sidebar">
      <div class="sidebar-header">
        Live Log
        <button class="clear-btn" onclick="clearLogs()">Clear</button>
      </div>
      <div class="log-feed" id="log-feed">
        <div class="empty-state">ログなし</div>
      </div>
    </aside>
  </div>

  <!-- New Task Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3>新規タスクを作成</h3>
      <div class="form-group">
        <label>部門</label>
        <select id="form-dept" onchange="updateAgentSelect()">
          <option value="">-- 選択 --</option>
        </select>
      </div>
      <div class="form-group">
        <label>エージェント</label>
        <select id="form-agent">
          <option value="">-- 部門を先に選択 --</option>
        </select>
      </div>
      <div class="form-group">
        <label>タスク名</label>
        <input type="text" id="form-title" placeholder="例: 設計レビューを実施">
      </div>
      <div class="form-group">
        <label>詳細 (任意)</label>
        <textarea id="form-desc" placeholder="タスクの詳細を記述..."></textarea>
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="submitTask()">作成</button>
      </div>
    </div>
  </div>

  <script>
    // ── State ──
    let agents = {};
    let tasks = [];
    let logEntries = [];
    let ws;

    // ── Init ──
    async function init() {
      const [agentsRes, tasksRes, logsRes, statsRes] = await Promise.all([
        fetch('/api/agents').then(r => r.json()),
        fetch('/api/tasks').then(r => r.json()),
        fetch('/api/logs').then(r => r.json()),
        fetch('/api/stats').then(r => r.json()),
      ]);
      agents = agentsRes;
      tasks = tasksRes;
      logEntries = logsRes;
      renderDepartments();
      renderTasks();
      renderLogs();
      updateStats(statsRes);
      populateDeptSelect();
      connectWS();
    }

    // ── WebSocket ──
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}`);
      ws.onopen = () => {
        document.getElementById('ws-dot').classList.add('connected');
        document.getElementById('ws-label').textContent = 'Connected';
      };
      ws.onclose = () => {
        document.getElementById('ws-dot').classList.remove('connected');
        document.getElementById('ws-label').textContent = 'Disconnected';
        setTimeout(connectWS, 3000);
      };
      ws.onmessage = (e) => {
        const { type, payload } = JSON.parse(e.data);
        if (type === 'task:created') {
          tasks.push(payload);
          renderTasks();
          refreshStats();
        } else if (type === 'task:updated') {
          const idx = tasks.findIndex(t => t.id === payload.id);
          if (idx >= 0) tasks[idx] = payload;
          renderTasks();
          refreshStats();
        } else if (type === 'task:deleted') {
          tasks = tasks.filter(t => t.id !== payload.id);
          renderTasks();
          refreshStats();
        } else if (type === 'log:new') {
          logEntries.push(payload);
          if (logEntries.length > 200) logEntries = logEntries.slice(-200);
          appendLog(payload);
        }
      };
    }

    // ── Render Departments ──
    function renderDepartments() {
      const grid = document.getElementById('dept-grid');
      grid.innerHTML = '';
      for (const [deptId, dept] of Object.entries(agents)) {
        const card = document.createElement('div');
        card.className = 'dept-card';
        card.innerHTML = `
          <div class="dept-card-header">
            <div>
              <div class="dept-name">${dept.name}</div>
              <div class="dept-name-en">${dept.nameEn}</div>
            </div>
            <span class="agent-count">${dept.agents.length}名</span>
          </div>
          <div class="agent-list">
            ${dept.agents.map(a => {
              const initial = a.name.slice(-2, -1);
              const running = tasks.some(t => t.agentId === a.id && t.status === 'running');
              const statusClass = running ? 'running' : 'idle';
              return `
                <div class="agent-item" onclick="filterAgent('${a.id}')">
                  <div class="agent-info">
                    <div class="agent-avatar">${initial}</div>
                    <div>
                      <div class="agent-name">${a.name}</div>
                      <div class="agent-role">${a.role}</div>
                    </div>
                  </div>
                  <div class="agent-status ${statusClass}"></div>
                </div>`;
            }).join('')}
          </div>
        `;
        grid.appendChild(card);
      }
    }

    // ── Render Tasks ──
    function renderTasks() {
      const list = document.getElementById('task-list');
      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty-state">タスクはまだありません</div>';
        return;
      }
      // Sort: running first, then pending, then completed/failed
      const order = { running: 0, pending: 1, completed: 2, failed: 3 };
      const sorted = [...tasks].sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));
      list.innerHTML = sorted.map(t => {
        const agentName = findAgentName(t.agentId);
        const time = new Date(t.updatedAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        return `
          <div class="task-item">
            <span class="task-status-badge ${t.status}">${t.status}</span>
            <div class="task-info">
              <div class="task-title">${escapeHtml(t.title)}</div>
              <div class="task-meta">
                <span>${agentName}</span>
                <span>${time}</span>
              </div>
            </div>
            <div class="task-actions">
              ${t.status === 'pending' ? `<button title="開始" onclick="updateTask('${t.id}', 'running')">&#9654;</button>` : ''}
              ${t.status === 'running' ? `<button title="完了" onclick="updateTask('${t.id}', 'completed')">&#10003;</button>` : ''}
              ${t.status === 'running' ? `<button title="失敗" onclick="updateTask('${t.id}', 'failed')">&#10007;</button>` : ''}
              <button title="削除" onclick="deleteTask('${t.id}')">&#128465;</button>
            </div>
          </div>`;
      }).join('');
      renderDepartments(); // refresh agent status dots
    }

    // ── Render Logs ──
    function renderLogs() {
      const feed = document.getElementById('log-feed');
      if (logEntries.length === 0) {
        feed.innerHTML = '<div class="empty-state">ログなし</div>';
        return;
      }
      feed.innerHTML = logEntries.slice(-100).map(logHTML).join('');
      feed.scrollTop = feed.scrollHeight;
    }

    function appendLog(entry) {
      const feed = document.getElementById('log-feed');
      if (feed.querySelector('.empty-state')) feed.innerHTML = '';
      feed.insertAdjacentHTML('beforeend', logHTML(entry));
      feed.scrollTop = feed.scrollHeight;
    }

    function logHTML(entry) {
      const time = new Date(entry.timestamp).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const agentName = findAgentName(entry.agentId) || entry.agentId;
      return `
        <div class="log-entry ${entry.level}">
          <span class="log-time">${time}</span>
          <span class="log-agent">${escapeHtml(agentName)}</span>
          <div class="log-message">${escapeHtml(entry.message)}</div>
        </div>`;
    }

    function clearLogs() {
      logEntries = [];
      document.getElementById('log-feed').innerHTML = '<div class="empty-state">ログなし</div>';
    }

    // ── Stats ──
    function updateStats(stats) {
      document.getElementById('stat-depts').textContent = stats.departments;
      document.getElementById('stat-agents').textContent = stats.totalAgents;
      document.getElementById('stat-running').textContent = stats.tasks.running;
      document.getElementById('stat-completed').textContent = stats.tasks.completed;
      document.getElementById('stat-failed').textContent = stats.tasks.failed;
    }

    async function refreshStats() {
      const stats = await fetch('/api/stats').then(r => r.json());
      updateStats(stats);
    }

    // ── Task API ──
    async function updateTask(id, status) {
      await fetch(`/api/tasks/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
    }

    async function deleteTask(id) {
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
    }

    // ── Modal ──
    function openNewTaskModal() {
      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      document.getElementById('form-title').value = '';
      document.getElementById('form-desc').value = '';
    }

    function populateDeptSelect() {
      const sel = document.getElementById('form-dept');
      sel.innerHTML = '<option value="">-- 選択 --</option>';
      for (const [id, dept] of Object.entries(agents)) {
        sel.innerHTML += `<option value="${id}">${dept.name}</option>`;
      }
    }

    function updateAgentSelect() {
      const deptId = document.getElementById('form-dept').value;
      const sel = document.getElementById('form-agent');
      if (!deptId || !agents[deptId]) {
        sel.innerHTML = '<option value="">-- 部門を先に選択 --</option>';
        return;
      }
      sel.innerHTML = agents[deptId].agents.map(a =>
        `<option value="${a.id}">${a.name}</option>`
      ).join('');
    }

    async function submitTask() {
      const department = document.getElementById('form-dept').value;
      const agentId = document.getElementById('form-agent').value;
      const title = document.getElementById('form-title').value.trim();
      const description = document.getElementById('form-desc').value.trim();

      if (!agentId || !title) {
        alert('エージェントとタスク名は必須です');
        return;
      }

      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agentId, department, title, description }),
      });

      closeModal();
    }

    // ── Filter by agent ──
    function filterAgent(agentId) {
      // TODO: open detail panel or filter logs
      console.log('Filter by agent:', agentId);
    }

    // ── Helpers ──
    function findAgentName(agentId) {
      for (const dept of Object.values(agents)) {
        const a = dept.agents.find(a => a.id === agentId);
        if (a) return a.name;
      }
      return agentId;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Go ──
    init();
  </script>
